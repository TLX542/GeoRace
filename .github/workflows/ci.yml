name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Expo CLI is provided by "expo" package; "npx expo" will use it.
      - name: Expo doctor
        run: npx expo-doctor

      # If you later add lint/test scripts, you can enable these:
      # - name: Lint
      #   run: npm run lint
      #
      # - name: Test
      #   run: npm test